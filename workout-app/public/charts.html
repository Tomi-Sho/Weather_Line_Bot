<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフ - 筋トレ記録</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#2f6fed">
</head>
<body>
  <header>
    <h1>グラフ</h1>
  </header>

  <main>
    <section class="panel">
      <h2>種目</h2>
      <select id="exercise" class="wide"></select>

      <h2 class="sub">指標</h2>
      <div id="metrics" class="chips"></div>

      <h2 class="sub">期間</h2>
      <div id="period" class="chips"></div>
    </section>

    <section class="panel">
      <div id="stats" class="stats"></div>
      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>
      <div id="empty" class="empty" hidden>この期間の記録がありません</div>
    </section>

    <section class="panel">
      <h2>体重の推移</h2>
      <div id="bw-stats" class="stats"></div>
      <div class="chart-box">
        <canvas id="bw-chart"></canvas>
      </div>
      <div id="bw-empty" class="empty" hidden>この期間の体重の記録がありません</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/common.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
